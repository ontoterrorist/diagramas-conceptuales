schema_version: "1.1"
name: deleuze-tres-sintesis
expected_outcome: |
  A TikZ diagram, compiled to PDF and PNG, of the three syntheses of time with the author's own terms (Habitus, Mnemosyne, Eros/Thanatos or the third synthesis by name), the caesura, and the eternal return drawn as a relation between series (return arc), not as a fourth term. Comes with a fidelity book whose rows are either backed by citable passages or marked interpretative, and a delivery paragraph that says what was left out. Compare with corpus diagrams 21-23.
